<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gun Run</title>
<style>
  :root { --cyan: #4ea0ff; --pink: #ff7a1a; --yellow: #ffc24a; --ink: #060a12; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { font-family: "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; z-index: 10; overflow-y: auto;
    background:
      radial-gradient(circle at 50% -10%, rgba(255, 122, 26, .28), transparent 55%),
      repeating-linear-gradient(115deg, rgba(78, 160, 255, .06) 0 2px, transparent 2px 22px),
      rgba(6, 10, 18, .9);
    display: flex; align-items: center; justify-content: center;
  }
  #overlay.hidden { display: none; }
  .card { width: min(920px, 100%); padding: 28px 20px 36px; box-sizing: border-box; text-align: center; }
  h1 {
    margin: 0; font-size: clamp(64px, 14vw, 150px); line-height: .9; font-style: italic; letter-spacing: -2px;
    color: var(--yellow); -webkit-text-stroke: 3px #000; text-shadow: 7px 7px 0 var(--pink), 12px 12px 0 #000;
    transform: rotate(-3deg) skewX(-6deg);
  }
  h1 { margin-bottom: 64px; }
  #btn-vr, #btn-desktop { font-size: 30px; padding: 16px 44px; }
  button[hidden] { display: none; }
  #crosshair {
    display: none; position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; z-index: 5; pointer-events: none;
    border: 2px solid var(--cyan); border-radius: 50%; box-sizing: border-box;
  }
  #crosshair::after { content: ""; position: absolute; left: 50%; top: 50%; width: 2px; height: 2px; margin: -1px; background: #fff; }
  .buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  button {
    font: inherit; font-style: italic; font-size: 24px; padding: 14px 30px; cursor: pointer; color: #000;
    background: var(--yellow); border: 3px solid #000; box-shadow: 6px 6px 0 var(--pink); transform: skewX(-6deg);
  }
  button.alt { background: var(--cyan); box-shadow: 6px 6px 0 #000; font-size: 18px; }
  button:disabled { background: #555a66; color: #1c1c22; box-shadow: 6px 6px 0 #000; cursor: default; }
  button:not(:disabled):active { transform: skewX(-6deg) translate(3px, 3px); box-shadow: 3px 3px 0 var(--pink); }
  .note { margin-top: 20px; font: 400 13px/1.5 Arial, sans-serif; color: #7f8aa3; }
  #status { min-height: 18px; margin-top: 10px; font: 700 14px Arial, sans-serif; color: #ff6a5a; }
</style>
<script>
  // Load the game with content-versioned script URLs (see tools/stamp.py), so updates show up on a normal reload.
  (function () {
    function boot(map, main) {
      var im = document.createElement('script'); im.type = 'importmap'; im.textContent = JSON.stringify({ imports: map });
      document.head.appendChild(im);
      var s = document.createElement('script'); s.type = 'module'; s.src = main;
      document.head.appendChild(s);
    }
    fetch('./version.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) { boot(v.imports, v.main); })
      .catch(function () { boot({ three: './vendor/three.module.min.js' }, './src/main.js?v=' + Date.now()); });
  })();
</script>
</head>
<body>
<div id="overlay">
  <div class="card">
    <h1>GUN RUN</h1>
    <div class="buttons">
      <button id="btn-vr" hidden>ENTER VR</button>
      <button id="btn-desktop" hidden>PLAY</button>
    </div>
    <div id="status">Loading track…</div>
    <p class="note" id="note">Contains fast motion and flashing lights.</p>
  </div>
</div>
<div id="crosshair"></div>
</body>
</html>
